name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler l'application Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Vérifications (syntaxe + tests métier)
        run: |
          python -m compileall -q app
          python tests/test_backend.py

      - name: Compiler (mode dossier)
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name PatrimoinePro
          --contents-directory _internal
          --icon assets/icon.ico
          --add-data "assets;assets"
          --distpath dist --workpath build --specpath .
          PatrimoinePro.pyw

      - name: Créer l'archive ZIP
        run: Compress-Archive -Path dist/PatrimoinePro/* -DestinationPath PatrimoinePro-windows.zip

      - name: Publier l'artefact de compilation
        uses: actions/upload-artifact@v4
        with:
          name: PatrimoinePro-windows
          path: PatrimoinePro-windows.zip
          if-no-files-found: error

      - name: Attacher le ZIP à la Release (étiquettes v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PatrimoinePro-windows.zip
          generate_release_notes: true
